<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
#card{position:relative;width:1200px;height:630px;overflow:hidden;background:#121214;color:#B9B6AF;font-family:Inter,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(55% 70% at 88% 20%,rgba(156,124,78,.22),transparent 70%),radial-gradient(45% 60% at 0% 100%,rgba(255,255,255,.04),transparent 70%)}
.mark{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:560px;filter:invert(1);opacity:.05}
.shot{position:absolute;left:640px;top:150px;width:720px;border-radius:10px;border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 80px -30px rgba(0,0,0,.9)}
.frame{position:absolute;left:622px;top:132px;width:90px;height:90px;border-left:1.5px solid #9C7C4E;border-top:1.5px solid #9C7C4E}
.txt{position:absolute;left:64px;top:56px;bottom:56px;width:900px;display:flex;flex-direction:column;justify-content:space-between}
.logo{height:26px;filter:invert(1);align-self:flex-start}
.eb{font:600 15px Inter;letter-spacing:.2em;text-transform:uppercase;color:#C9A876}
h1{font:600 82px/1.02 Cormorant,serif;color:#F7F4EE;margin:18px 0 0;letter-spacing:-.01em}
h1 u{text-decoration:none;border-bottom:3px solid #9C7C4E}
.foot{font:500 19px Inter;color:#8B887F}
</style></head><body><div id="card"><div class="glow"></div><img class="mark" src="../../assets/sw-logo-monogram.png">
<div class="txt"><img class="logo" src="../../assets/sw-logo-simple.png"><div><div class="eb">Custom software · Talk to us</div><h1>A conversation,<br>not a <u>pitch.</u></h1></div><div class="foot">starkwayne.co.uk</div></div></div></body></html>
