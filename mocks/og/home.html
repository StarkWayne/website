<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
#card{position:relative;width:1200px;height:630px;overflow:hidden;background:#121214;color:#B9B6AF;font-family:Inter,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(55% 70% at 88% 20%,rgba(156,124,78,.22),transparent 70%),radial-gradient(45% 60% at 0% 100%,rgba(255,255,255,.04),transparent 70%)}

.frame{position:absolute;left:682px;top:132px;width:90px;height:90px;border-left:1.5px solid #9C7C4E;border-top:1.5px solid #9C7C4E}
.txt{position:absolute;left:64px;top:56px;bottom:56px;width:590px;display:flex;flex-direction:column;justify-content:space-between}
.logo{height:34px;filter:invert(1);align-self:flex-start}
.eb{font:700 19px Inter;letter-spacing:.16em;text-transform:uppercase;color:#C9A876}
h1{font:700 64px/1.04 Cormorant,serif;color:#F7F4EE;margin:18px 0 0;letter-spacing:-.01em}
h1 u{text-decoration:none;border-bottom:5px solid #9C7C4E}
.foot{font:600 24px Inter;color:#A9A59C}
</style></head><body><div id="card"><div class="glow"></div><div class="frame"></div><img class="shot" src="../../assets/mpx-screen-mono.jpg">
